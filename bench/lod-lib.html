<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>glyphcss bench · per-mesh detail + occlusion</title>
  <style>
    html, body { margin: 0; background: #04060b; color: rgba(255,232,184,0.92);
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
    body { overflow: hidden; }
    .bench { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
      padding: 10px 14px; border-bottom: 1px solid rgba(255,232,184,0.14); background: #06080d; font-size: 12px; }
    .bar label { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,232,184,0.6); }
    select { background: #0d1118; color: rgba(255,232,184,0.92); border: 1px solid rgba(255,232,184,0.25); border-radius: 0; padding: 3px 6px; font: inherit; }
    .stage { flex: 1; position: relative; min-height: 0; }
    .host { position: absolute; inset: 0; }
    .host .glyph-output { margin: 0; }
    .hud { position: absolute; top: 12px; left: 12px; z-index: 60; background: rgba(6,8,13,0.86);
      border: 1px solid rgba(255,232,184,0.18); padding: 10px 12px; font-size: 11px; line-height: 1.6;
      min-width: 230px; backdrop-filter: blur(4px); pointer-events: none; white-space: pre; }
    .hud b { color: rgba(56,189,248,0.95); }
  </style>
</head>
<body>
  <div class="bench">
    <div class="bar">
      <label>camera
        <select id="cam"><option value="ortho">orthographic</option><option value="persp">perspective</option></select>
      </label>
      <label>hero font-size <input type="range" id="fs" min="2" max="12" step="1" value="4" /><span id="fs-v">4</span>px</label>
      <label><input type="checkbox" id="transparent" /> hero transparent (don't occlude)</label>
      <label><input type="checkbox" id="colors" checked /> colors</label>
      <label><input type="checkbox" id="spin" /> spin</label>
      <span style="color:rgba(255,232,184,0.45)">drag to orbit · wheel to zoom</span>
    </div>
    <div class="stage">
      <div class="host" id="host"></div>
      <div class="hud" id="hud"></div>
    </div>
  </div>
  <script type="module" src="./lod-lib.bundle.js"></script>
</body>
</html>
