name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the compile package's CLI/Vite parity test executes the real
      # built CLI, which resolves `glyphcss` and `@glyphcss/core` from their
      # `dist/`. Running tests before the build passed only on a machine with
      # stale build output lying around.
      - name: Build packages (DTS + JS)
        run: pnpm build:packages

      # ONE package's vitest at a time. pnpm's default
      # `--workspace-concurrency` of 4 ran four packages' vitest processes
      # together, each taking `cpus - 1` forks — 12 forks plus 4 mains on a
      # 4-vCPU runner. Vitest orders files largest-first on a fresh checkout,
      # so `@glyphcss/maps`' two biggest integration files landed in that
      # window every run and timed out on correct work. vitest cannot see
      # across package boundaries, so no `maxWorkers`/`pool` setting can fix
      # it. The env var rather than a flag: the flag would have to live inside
      # the root `test` script and would serialize a developer's machine too.
      # Full record, including why not a separate `maps` job:
      # docs/design/maps.md, "`map.idle()`".
      - name: Run tests
        run: pnpm test
        env:
          NPM_CONFIG_WORKSPACE_CONCURRENCY: 1

      - name: Type-check against built declarations
        run: pnpm -r --if-present run test:types

      - name: Build website
        run: pnpm build:website
